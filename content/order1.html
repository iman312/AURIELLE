<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order — Aurielle</title>

  <link rel="stylesheet" href="../style/style.css" />
  <link rel="stylesheet" href="../style/order.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="order.js"></script>
</head>

<body>

<header class="header dark" id="header">
  <div class="container">
    <nav class="nav">
      <a href="../index.html" class="nav-logo">
        <img src="../images/logo.png" alt="Aurielle logo" />
        <div class="nav-logo-text">
          <span class="brand">AURIELLE</span>
          <span class="brand-sub">Fine Jewelry</span>
        </div>
      </a>

      <ul class="nav-links">
        <li><a href="../index.html">Home</a></li>
        <li><a href="products.html">Shop</a></li>
        <li><a href="order.html" class="active">Order</a></li>
      </ul>

      <div class="nav-auth" id="navAuth">
        <a href="login.html">Login</a>
        <a href="register.html" class="nav-auth-primary">Register</a>
      </div>
    </nav>
  </div>
</header>


<main class="order-page">
  <div class="container">

    <div class="order-title-block">
      <span class="section-label">Checkout</span>
      <h1>Complete Your Order</h1>
    </div>

    <div id="orderAlert" class="alert"></div>

    <div class="order-grid">

      <!-- FORM -->
      <div class="order-form">

        <h2 class="order-section-title">Delivery Information</h2>

        <form id="orderForm" novalidate>

          <div class="form-row">
            <div class="form-group">
              <label for="orderFirstName">First Name</label>
              <input type="text" id="orderFirstName" placeholder="Sophie" required />
              <span class="field-msg" id="orderFirstNameMsg"></span>
            </div>

            <div class="form-group">
              <label for="orderLastName">Last Name</label>
              <input type="text" id="orderLastName" placeholder="Ramdani" required />
              <span class="field-msg" id="orderLastNameMsg"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="orderEmail">Email Address</label>
            <input type="email" id="orderEmail" placeholder="your@email.com" required />
            <span class="field-msg" id="orderEmailMsg"></span>
          </div>

          <div class="form-group">
            <label for="orderPhone">Phone Number</label>
            <input type="tel" id="orderPhone" placeholder="0612345678"
                   maxlength="10" inputmode="numeric" pattern="[0-9]{10}" required />
            <span class="field-msg" id="orderPhoneMsg"></span>
          </div>

          <div class="form-group">
            <label for="orderAddress">Delivery Address</label>
            <input type="text" id="orderAddress" placeholder="Azeffun Tizi-Ouzou" required />
            <span class="field-msg" id="orderAddressMsg"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="orderCity">City</label>
              <input type="text" id="orderCity" placeholder="Tizi-Ouzou" />
            </div>

            <div class="form-group">
              <label for="orderZip">Postal Code</label>
              <input type="text" id="orderZip" placeholder="15000" required />
              <span class="field-msg" id="orderZipMsg"></span>
            </div>
          </div>

          <h2 class="order-section-title">Payment Details</h2>

          <div class="payment-icons">
            <span><i class="fa-brands fa-cc-visa"></i></span>
            <span><i class="fa-brands fa-cc-mastercard"></i></span>
            <span><i class="fa-brands fa-cc-paypal"></i></span>
          </div>

          <div class="form-group">
            <label for="cardNum">Card Number</label>
            <input type="text" id="cardNum" placeholder="1234 5678 9012 3456" maxlength="19" required />
            <span class="field-msg" id="cardNumMsg"></span>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="cardExpiry">Expiry (MM/YY)</label>
              <input type="text" id="cardExpiry" placeholder="08/27" maxlength="5" required />
              <span class="field-msg" id="cardExpiryMsg"></span>
            </div>

            <div class="form-group">
              <label for="cardCvv">CVV</label>
              <input type="text" id="cardCvv" placeholder="123" maxlength="4" required />
              <span class="field-msg" id="cardCvvMsg"></span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary full-btn">
            Place Order <i class="fa-solid fa-bag-shopping"></i>
          </button>

        </form>
      </div>


      <!-- SUMMARY -->
      <aside class="order-summary" id="orderSummary">

        <h3>Order Summary</h3>

        <div id="summaryItems">
          <p class="empty-cart">
            Your cart is empty.<br>
            <a href="products.html">Browse the collection →</a>
          </p>
        </div>

        <div class="summary-totals" id="summaryTotals">
          <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0</span></div>
          <div class="summary-row"><span>Shipping</span><span>Free</span></div>
          <div class="summary-row"><span>Tax (8%)</span><span id="tax">$0</span></div>
          <div class="summary-row total"><span>Total</span><span id="total">$0</span></div>
        </div>

      </aside>

    </div>
  </div>
</main>


<footer class="footer">
  <div class="container">
    <p class="footer-copy">&copy; 2026 Aurielle Fine Jewelry.</p>
  </div>
</footer>

<script src="../javascript/auth.js"></script>
<script src="../javascript/validation.js"></script>
<script src="../javascript/order.js"></script>

</body>
</html>
